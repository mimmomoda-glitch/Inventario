<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAV Bar Manager PRO</title>
    <style>
        :root {
            --primary: #2c3e50;
            --primary-light: #34495e;
            --accent: #e67e22;
            --accent-hover: #d35400;
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
            --pend: #2980b9;
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-color: #e2e8f0;
            --input-bg: #f8fafc;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --transition: all 0.2s ease;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --border-color: #334155;
            --input-bg: #0f172a;
            --primary: #38bdf8;
            --primary-light: #0284c7;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.3), 0 2px 4px -1px rgba(0,0,0,0.2);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 0; 
            color: var(--text-color); 
            user-select: none; 
            overflow-x: hidden;
            transition: var(--transition);
        }
        
        .app-header { background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
        .app-logo { font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; gap: 6px; }
        
        .boat-select {
            background: rgba(230, 126, 34, 0.1);
            border: 1px solid rgba(230, 126, 34, 0.3);
            border-radius: 6px;
            padding: 4px 24px 4px 8px;
            color: var(--accent);
            font-weight: 800;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%23e67e22" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>');
            background-repeat: no-repeat;
            background-position-x: calc(100% - 2px);
            background-position-y: 50%;
            max-width: 200px;
            text-transform: uppercase;
        }
        body[data-theme="dark"] .boat-select {
            background-color: rgba(56, 189, 248, 0.1);
            border-color: rgba(56, 189, 248, 0.3);
            color: var(--primary);
            background-image: url('data:image/svg+xml;utf8,<svg fill="%2338bdf8" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>');
        }

        .theme-toggle { background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; }

        .tabs { display: flex; background: var(--card-bg); position: sticky; top: 0; z-index: 100; overflow-x: auto; scrollbar-width: none; border-bottom: 2px solid var(--border-color); }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn { flex: 1; padding: 14px 6px; color: var(--text-color); border: none; background: none; font-weight: 700; font-size: 0.62rem; text-transform: uppercase; opacity: 0.6; min-width: 80px; text-align: center; transition: var(--transition); cursor: pointer; }
        .tab-btn.active { opacity: 1; color: var(--accent); border-bottom: 4px solid var(--accent); border-bottom: 4px solid var(--accent); }
        
        .content { padding: 12px; padding-bottom: 230px; max-width: 600px; margin: 0 auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Dashboard */
        .mini-dash { background: var(--card-bg); padding: 16px; border-radius: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        .stat { text-align: center; }
        .stat span { font-size: 0.65rem; color: #7f8c8d; display: block; text-transform: uppercase; font-weight: bold; margin-bottom: 4px; }
        .stat b { font-size: 1.1rem; color: var(--text-color); }
        .stat.highlight b { color: var(--success); font-size: 1.5rem; }
        .stat.paga-highlight { grid-column: span 2; background: linear-gradient(135deg, rgba(39, 174, 96, 0.1) 0%, rgba(46, 204, 113, 0.15) 100%); border: 1px solid rgba(39, 174, 96, 0.3); border-radius: 12px; padding: 10px; margin-top: 4px; }
        .stat.paga-highlight b { color: var(--success); font-size: 1.4rem; }
        
        /* Product Cards */
        .product-card { background: var(--card-bg); margin-bottom: 12px; border-radius: 16px; padding: 14px; box-shadow: var(--shadow); border-left: 5px solid var(--accent); border-top: 1px solid var(--border-color); border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); transition: var(--transition); }
        .ordine-card { background: var(--card-bg); margin-bottom: 12px; border-radius: 16px; padding: 14px; box-shadow: var(--shadow); border-left: 5px solid var(--accent); border-top: 1px solid var(--border-color); border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); transition: var(--transition); }
        
        .prod-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .prod-name { font-weight: bold; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 65%; }
        
        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label { font-size: 0.6rem; font-weight: 800; color: #8a99ad; text-transform: uppercase; text-align: center; }
        
        .stepper-container { display: flex; align-items: center; background: var(--input-bg); border-radius: 10px; border: 1px solid var(--border-color); overflow: hidden; height: 46px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
        .step-btn { width: 40px; height: 100%; border: none; background: rgba(0,0,0,0.03); font-size: 1.3rem; font-weight: bold; color: var(--text-color); cursor: pointer; touch-action: manipulation; transition: background 0.1s; }
        .step-btn:active { background: rgba(0,0,0,0.1); }
        .numpad-trigger { flex: 1; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; font-weight: bold; color: var(--text-color); background: transparent; border: none; outline: none; cursor: pointer; }
        .info-row { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border-color); display: flex; justify-content: space-between; font-size: 0.7rem; color: #7f8c8d; }
        
        /* Keyboard Overlay */
        #numpad-overlay { position: fixed; bottom: 0; left: 0; width: 100%; background: #d1d4d9; z-index: 2500; display: none; padding: 16px; box-sizing: border-box; box-shadow: 0 -10px 30px rgba(0,0,0,0.25); border-radius: 28px 28px 0 0; transition: transform 0.2s ease; }
        body[data-theme="dark"] #numpad-overlay { background: #1e293b; }
        .numpad-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: var(--card-bg); padding: 14px; border-radius: 16px; border: 1px solid var(--border-color); }
        .numpad-header b { font-size: 1.6rem; color: var(--text-color); }
        .numpad-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .num-btn { background: var(--card-bg); border: none; padding: 16px 0; border-radius: 14px; font-size: 1.4rem; font-weight: bold; color: var(--text-color); box-shadow: 0 4px 0 rgba(0,0,0,0.15); cursor: pointer; transition: transform 0.05s, box-shadow 0.05s; }
        .num-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.1); }
        .num-btn.math { background: var(--warning); color: white; }
        .num-btn.close { background: var(--success); color: white; grid-column: span 2; }
        .num-btn.clear { background: var(--danger); color: white; }
        .num-btn.dot { background: #95a5a6; color: white; }

        /* Actions Fixed */
        .bottom-actions { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; background: var(--card-bg); padding: 12px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 -4px 20px rgba(0,0,0,0.08); z-index: 200; border-top: 1px solid var(--border-color); border-radius: 16px 16px 0 0; }
        .btn { flex: 1; padding: 14px; border: none; border-radius: 10px; font-weight: bold; color: white; font-size: 0.9rem; text-align: center; cursor: pointer; transition: var(--transition); }
        .btn:active { transform: scale(0.98); }
        .btn-success { background: var(--success); }
        .btn-neutral { background: var(--primary-light); }
        .btn-danger { background: var(--danger); }
        .btn-warning { background: var(--warning); }
        .btn-wa { background: #25D366; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        .search-container { position: relative; margin-bottom: 12px; }
        .search-bar { width: 100%; padding: 14px 14px 14px 40px; border-radius: 12px; border: 1px solid var(--border-color); box-sizing: border-box; font-size: 1rem; background: var(--card-bg); color: var(--text-color); outline: none; transition: var(--transition); }
        .search-bar:focus { border-color: var(--accent); }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #7f8c8d; }
        
        .price-input { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; text-align: center; font-weight: bold; box-sizing: border-box; background: var(--input-bg); color: var(--text-color); }
        .price-edit-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: var(--input-bg); padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); margin-top: 8px; }
        
        .badge { padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 0.72rem; }
        .badge-danger { background: #fde8e8; color: var(--danger); }
        body[data-theme="dark"] .badge-danger { background: #7f1d1d; color: #fca5a5; }
        .badge-success { background: #eafaf1; color: var(--success); }
        body[data-theme="dark"] .badge-success { background: #14532d; color: #86efac; }
        .badge-neutral { background: var(--input-bg); color: #7f8c8d; }
        
        .inv-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; font-size: 0.78rem; border-bottom: 1px dashed var(--border-color); }
        
        /* Register & Inventory Dashboards */
        .registro-table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 10px; overflow: hidden; font-size: 0.75rem; margin-top: 10px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        .registro-table th, .registro-table td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .registro-table th { background: var(--primary-light); color: white; font-weight: bold; font-size: 0.65rem; text-transform: uppercase; }
        .registro-table tr.clickable-row { cursor: pointer; transition: background 0.15s; }
        .registro-table tr.clickable-row:hover { background: rgba(0,0,0,0.02); }
        body[data-theme="dark"] .registro-table tr.clickable-row:hover { background: rgba(255,255,255,0.02); }
        .registro-table tr:last-child td { border-bottom: none; }
        
        .registro-dash { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 15px; }
        .reg-card { background: var(--card-bg); padding: 12px 6px; border-radius: 12px; text-align: center; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        .reg-card span { font-size: 0.58rem; color: #7f8c8d; display: block; text-transform: uppercase; margin-bottom: 4px; font-weight: bold; }
        .reg-card b { font-size: 0.9rem; }

        /* Modals and Toasts */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; backdrop-filter: blur(4px); }
        .modal-card { background: var(--card-bg); border-radius: 20px; padding: 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border: 1px solid var(--border-color); text-align: center; animation: modalScale 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes modalScale { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-title { font-size: 1.1rem; font-weight: bold; color: var(--text-color); margin-bottom: 12px; }
        .modal-body { font-size: 0.9rem; color: #7f8c8d; margin-bottom: 20px; line-height: 1.4; white-space: pre-line; }
        .modal-buttons { display: flex; gap: 10px; justify-content: center; }
        .modal-btn { flex: 1; padding: 12px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; font-size: 0.85rem; transition: var(--transition); }
        .modal-btn-ok { background: var(--accent); color: white; }
        .modal-btn-cancel { background: var(--input-bg); color: var(--text-color); border: 1px solid var(--border-color); }
        .modal-btn-confirm { background: var(--danger); color: white; }

        .toast-box { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--primary-light); color: white; padding: 12px 24px; border-radius: 50px; font-weight: bold; font-size: 0.85rem; box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 3500; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; display: flex; align-items: center; gap: 8px; }
        .toast-box.show { transform: translateX(-50%) translateY(0); }

        .sales-breakdown-card { background: var(--card-bg); padding: 16px; border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--border-color); margin-bottom: 16px; }
        .sales-list-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; }
        .sales-list-item:last-child { border-bottom: none; }
        .history-expanded-row { background: var(--input-bg); border-bottom: 1px solid var(--border-color); }
        .history-expanded-content { padding: 12px 16px; font-size: 0.8rem; }
        .history-expanded-title { font-weight: bold; color: var(--accent); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .history-detail-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--border-color); }
        .history-detail-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

<div class="app-header">
    <div class="app-logo">
        🛳️
        <select id="boat-selector" class="boat-select" onchange="changeBoat(this.value)">
            <!-- Popolato via JS -->
        </select>
        <small style="font-size:0.65rem; color:#7f8c8d;">PRO</small>
    </div>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Cambia Tema">🌓</button>
</div>

<div class="tabs">
    <button class="tab-btn active" id="btn-vendite" onclick="openTab('tab-vendite')">💰 VENDITE</button>
    <button class="tab-btn" id="btn-magazzino" onclick="openTab('tab-magazzino')">📦 STOCK</button>
    <button class="tab-btn" id="btn-ordini" onclick="openTab('tab-ordini')">🛒 ORDINI</button>
    <button class="tab-btn" id="btn-riepilogo" onclick="openTab('tab-riepilogo')">📊 INV & REG</button>
</div>

<div class="content">
    <div class="mini-dash">
        <div class="stat highlight" style="grid-column: span 2;"><span>Incasso di Oggi</span><b id="m-netto">€ 0.00</b></div>
        <div class="stat"><span>Pass. Oggi</span><b id="count-pas">0</b></div>
        <div class="stat"><span>Pend. Oggi</span><b id="count-pen" style="color:var(--pend)">0</b></div>
        <div class="stat paga-highlight">
            <span>💶 LA TUA PAGA DI OGGI</span><b id="paga-live">€ 26.00</b>
            <small style="display:block; font-size:0.65rem; color:#27ae60; margin-top:2px;" id="paga-live-dettaglio">(Fisso €26.00 + 5% su €0.00)</small>
        </div>
    </div>

    <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="search" class="search-bar" placeholder="Cerca prodotto...">
    </div>

    <div id="tab-vendite" class="tab-content active"></div>
    <div id="tab-magazzino" class="tab-content"></div>
    <div id="tab-ordini" class="tab-content"></div>
    
    <!-- L'UNICA SCHEDA CHE CONTIENE TUTTO (INV + REGISTRO) -->
    <div id="tab-riepilogo" class="tab-content">
        <div id="riepilogo-container-interno"></div>
    </div>
</div>

<!-- MODALE INSERIMENTO CARICO DDT SINGOLO -->
<div class="modal-overlay" id="ddtModal">
    <div class="modal-card">
        <div class="modal-title" style="color: var(--accent);">➕ Registra Carico DDT</div>
        <div class="modal-body" style="text-align: left;">
            <p id="ddtModalProdName" style="font-weight: bold; margin-bottom: 12px; font-size: 1rem; text-align: center; background: var(--input-bg); padding: 8px; border-radius: 8px;"></p>
            <div class="field" style="margin-bottom: 14px;"><label style="text-align: left; margin-bottom: 4px;">Numero DDT o Fattura</label><input type="text" id="ddtModalNum" class="price-input" placeholder="Es. DDT-1025" style="text-align: left; padding: 10px;"></div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;">
                <div class="field"><label style="text-align: center; margin-bottom: 4px; color: var(--accent);">☕ Quantità al BAR</label><div class="stepper-container" style="border-color: var(--accent); background: rgba(230, 126, 34, 0.03);"><div class="numpad-trigger" onclick="openNumpad('ddt-qta-bar', 'Quantità al Bar')"><span id="txt-ddt-qta-bar-display" style="font-size: 1.2rem; font-weight: bold; color: var(--accent);">0</span></div></div></div>
                <div class="field"><label style="text-align: center; margin-bottom: 4px; color: var(--primary-light);">🚚 Quantità DEPOSITO</label><div class="stepper-container" style="border-color: var(--primary-light); background: var(--input-bg);"><div class="numpad-trigger" onclick="openNumpad('ddt-qta-dep', 'Quantità Deposito')"><span id="txt-ddt-qta-dep-display" style="font-size: 1.2rem; font-weight: bold; color: var(--primary-light);">0</span></div></div></div>
            </div>
            <div style="background: var(--input-bg); border-radius: 8px; padding: 10px; text-align: center; border: 1px dashed var(--border-color); font-weight: bold;">Totale Carico DDT: <span id="txt-ddt-tot-display" style="color: var(--success); font-size: 1.1rem;">0</span> pz</div>
        </div>
        <div class="modal-buttons" style="margin-top: 15px;"><button class="modal-btn modal-btn-cancel" onclick="closeDdtModal()">Annulla</button><button class="modal-btn modal-btn-ok" onclick="salvaNuovoDdt()">Registra Carico</button></div>
    </div>
</div>

<!-- KEYBOARD NUMPAD -->
<div id="numpad-overlay">
    <div class="numpad-header" style="flex-direction: column; align-items: stretch; gap: 4px; border: 1px solid var(--border-color); border-radius: 16px; padding: 14px;">
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: #7f8c8d; font-weight: bold;"><span id="numpad-title">Valore</span><span id="numpad-expression" style="color: var(--accent); font-size: 0.9rem; letter-spacing: 0.5px;"></span></div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
            <div style="display: flex; gap: 6px;" id="numpad-shortcuts"><button class="btn" style="padding: 6px 10px; font-size: 0.72rem; background: var(--primary-light); color: white; border-radius: 8px; font-weight: bold;" onclick="addShortcutVal(6)">+6</button><button class="btn" style="padding: 6px 10px; font-size: 0.72rem; background: var(--primary-light); color: white; border-radius: 8px; font-weight: bold;" onclick="addShortcutVal(12)">+12</button><button class="btn" style="padding: 6px 10px; font-size: 0.72rem; background: var(--primary-light); color: white; border-radius: 8px; font-weight: bold;" onclick="addShortcutVal(24)">+24</button></div>
            <b id="numpad-display" style="font-size: 1.9rem; color: var(--text-color); font-weight: 800; letter-spacing: -0.5px;">0</b>
        </div>
    </div>
    <div class="numpad-grid" style="margin-top: 12px;"><button class="num-btn" onclick="pressNum(1)">1</button><button class="num-btn" onclick="pressNum(2)">2</button><button class="num-btn" onclick="pressNum(3)">3</button><button class="num-btn math" onclick="pressOp('+')">+</button><button class="num-btn" onclick="pressNum(4)">4</button><button class="num-btn" onclick="pressNum(5)">5</button><button class="num-btn" onclick="pressNum(6)">6</button><button class="num-btn math" onclick="pressOp('x')">×</button><button class="num-btn" onclick="pressNum(7)">7</button><button class="num-btn" onclick="pressNum(8)">8</button><button class="num-btn" onclick="pressNum(9)">9</button><button class="num-btn clear" onclick="pressClear()">C</button><button class="num-btn dot" onclick="pressDot()">.</button><button class="num-btn" onclick="pressNum(0)">0</button><button class="num-btn" onclick="pressDelete()">⌫</button><button class="num-btn close" onclick="closeNumpad()">OK</button></div>
</div>

<div class="bottom-actions">
    <button class="btn btn-wa" onclick="condividiWhatsApp()"><span>📲</span> COPIA & INVIA REPORT WHATSAPP</button>
    <div style="display:flex; gap:8px;"><button class="btn btn-neutral" onclick="openTab('tab-vendite')">TORNA VENDITE</button><button class="btn btn-success" onclick="openTab('tab-riepilogo')">VAI AL RIEPILOGO GENERALE</button></div>
</div>

<div class="modal-overlay" id="customModal">
    <div class="modal-card"><div class="modal-title" id="customModalTitle">Attenzione</div><div class="modal-body" id="customModalBody"></div><div class="modal-buttons" id="customModalButtons"></div></div>
</div>

<div class="toast-box" id="toastNotification"><span id="toastIcon">✨</span> <span id="toastMessage">Operazione riuscita!</span></div>

        if (val === undefined || val === null) return 0;
        if (typeof val === 'number') return isNaN(val) ? 0 : val;
        let parsed = parseFloat(String(val).replace(/[^0-9.-]/g, '').replace(',', '.'));
        return isNaN(parsed) ? 0 : parsed;
    }

            }

        o.totalePezzi = totPezzi; o.caricatoBar = totBar; o.caricatoDep = totDep; o.dataArrivo = new Date().toLocaleString('it-IT');

    function stepInventarioPendolari(id, delta) { 
        const p = prodotti.find(x => x.id === id); if(!p) return; 
        let t = Math.max(0, p.inizio + p.c - (p.accPas + p.accPen)); let m = Math.max(0, t - p.fisicoIn); p.vPen = Math.max(0, Math.min(m, p.vPen + delta)); update(); 
    }
    
    function step(fId, d) {
        const [f, id] = fId.split('-'); const p = prodotti.find(x => x.id === id); if(!p) return;
        if(f === 'vPas' || f === 'vPen') {
            if(d > 0) { if(p.q > 0) p.q--; else if(p.fis > 0) p.fis--; else p.q--; p[f]++; p.fisicoIn--; } 
            else { if(p[f] > 0) { p[f]--; p.q++; p.fisicoIn++; } }
        }
        else if(f === 'q') {
            if (d > 0) { if (p.fis > 0) { p.q++; p.fis--; } else { p.q++; p.fisicoIn++; } } 
            else { p.q--; p.fisicoIn--; }
        }
        else if(f === 'fis') { p.fis += d; p.fisicoIn += d; }
        else if(f === 'inizio') { p.inizio = Math.max(0, p.inizio + d); p.fisicoIn = Math.max(0, p.fisicoIn + d); }
        else if(f === 'c') { p.c = Math.max(0, p.c + d); p.fisicoIn = Math.max(0, p.fisicoIn + d); }
        else if(f === 'fisicoIn') {
            if (d > 0) { p.q++; p.fisicoIn++; } 
            else { if(p.q > 0) p.q--; else if(p.fis > 0) p.fis--; else p.q--; p.fisicoIn--; }
        }
        update();
    }

    function openNumpad(id, title, dec = false) {
        currentInputId = id; decimalMode = dec; numpadExpression = ""; isResetting = false; let v = "0";
        if (id === 'cassa-reale-global') v = cassaRealeGlobal.toFixed(2); 
        else if (id === 'ddt-qta-bar') v = String(tempDdtBar); 
        else if (id === 'ddt-qta-dep') v = String(tempDdtDep);
        else if (id.startsWith('req-new-')) { const el = document.getElementById(`txt-req-new-${id.split('-')[2]}`); v = el ? el.innerText : "0"; }
        else if (id.startsWith('arr-bar-')) { const el = document.getElementById(`txt-arr-bar-${id.split('-')[2]}`); v = el ? el.innerText : "0"; }
        else if (id.startsWith('arr-dep-')) { const el = document.getElementById(`txt-arr-dep-${id.split('-')[2]}`); v = el ? el.innerText : "0"; }
        else if (id.startsWith('invPend-')) v = String(prodotti.find(x => x.id === id.split('-')[1]).vPen || 0); 
        else v = String(prodotti.find(x => x.id === id.split('-')[1])[id.split('-')[0]] || 0);
        
        numpadCurrentVal = v; document.getElementById('numpad-title').innerText = title; document.getElementById('numpad-display').innerText = v; document.getElementById('numpad-shortcuts').style.visibility = id === 'cassa-reale-global' ? 'hidden' : 'visible'; document.getElementById('numpad-overlay').style.display = 'block';
    }
    function pressNum(n) { numpadCurrentVal = (numpadCurrentVal === "0" || isResetting) ? String(n) : numpadCurrentVal + String(n); isResetting = false; document.getElementById('numpad-display').innerText = numpadCurrentVal; }
    function pressDot() { if (!numpadCurrentVal.includes('.')) { numpadCurrentVal += '.'; document.getElementById('numpad-display').innerText = numpadCurrentVal; } }
    function pressOp(op) { let v = parseFloat(numpadCurrentVal) || 0; if (numpadExpression === "") numpadExpression = v + " " + (op === 'x' ? '×' : op); else { let r = evalExpression(numpadExpression + " " + v); numpadExpression = r + " " + (op === 'x' ? '×' : op); numpadCurrentVal = String(r); document.getElementById('numpad-display').innerText = numpadCurrentVal; } document.getElementById('numpad-expression').innerText = numpadExpression; isResetting = true; }
    function addShortcutVal(num) { numpadCurrentVal = String((parseFloat(numpadCurrentVal) || 0) + num); document.getElementById('numpad-display').innerText = numpadCurrentVal; }
    function evalExpression(e) { try { return Number(Function('"use strict";return (' + e.replace(/×/g, '*').replace(/x/g, '*') + ')')().toFixed(4)); } catch(err) { return 0; } }
    function pressClear() { numpadCurrentVal = "0"; numpadExpression = ""; document.getElementById('numpad-display').innerText = "0"; document.getElementById('numpad-expression').innerText = ""; }
    function pressDelete() { numpadCurrentVal = numpadCurrentVal.length > 1 ? numpadCurrentVal.slice(0, -1) : "0"; document.getElementById('numpad-display').innerText = numpadCurrentVal; }
    
    function closeNumpad() {
        if (currentInputId) {
            let val = parseFloat(numpadCurrentVal) || 0; if (numpadExpression !== "") val = evalExpression(numpadExpression + " " + val);
            if(currentInputId === 'cassa-reale-global') { cassaRealeGlobal = val; localStorage.setItem(getStorageKey('cassa'), cassaRealeGlobal.toFixed(2)); } 
            else if (currentInputId === 'ddt-qta-bar') { tempDdtBar = Math.round(val); aggiornaDdtTotale(); } 
            else if (currentInputId === 'ddt-qta-dep') { tempDdtDep = Math.round(val); aggiornaDdtTotale(); } 
            else if (currentInputId.startsWith('invPend-')) { 
                const p = prodotti.find(x => x.id === currentInputId.split('-')[1]); 
                let m = Math.max(0, p.inizio + p.c - (p.accPas + p.accPen) - p.fisicoIn); p.vPen = Math.max(0, Math.min(m, Math.round(val))); 
            } 
            else if (currentInputId.startsWith('req-new-')) { const el = document.getElementById(`txt-req-new-${currentInputId.split('-')[2]}`); if(el) el.innerText = Math.round(val); }
            else if (currentInputId.startsWith('arr-bar-')) { const el = document.getElementById(`txt-arr-bar-${currentInputId.split('-')[2]}`); if(el) el.innerText = Math.round(val); }
            else if (currentInputId.startsWith('arr-dep-')) { const el = document.getElementById(`txt-arr-dep-${currentInputId.split('-')[2]}`); if(el) el.innerText = Math.round(val); }
            else {
                const [f, id] = currentInputId.split('-'); const p = prodotti.find(x => x.id === id); let v = decimalMode ? val : Math.round(val);
                if(f === 'vPas' || f === 'vPen') {
                    let diff = v - p[f];
                    if(diff > 0) { for(let i=0; i<diff; i++) { if(p.q > 0) p.q--; else if(p.fis > 0) p.fis--; else p.q--; } p.fisicoIn -= diff; } 
                    else if(diff < 0) { p.q += Math.abs(diff); p.fisicoIn += Math.abs(diff); }
                    p[f] = v;
                } 
                else if(f === 'q') {
                    let diff = v - p.q;
                    if(diff > 0) { let fromFis = Math.min(p.fis, diff); p.q = v; p.fis -= fromFis; p.fisicoIn += (diff - fromFis); } 
                    else { p.q = v; p.fisicoIn += diff; }
                } 
                else if(f === 'fis') { let diff = v - p.fis; p.fis = v; p.fisicoIn += diff; }
                else if(f === 'inizio') {
                    let diff = v - p.inizio;
                    p.inizio = v;
                    p.fisicoIn = Math.max(0, p.fisicoIn + diff);
                }
                else if(f === 'c') {
                    let diff = v - p.c;
                    p.c = v;
                    p.fisicoIn = Math.max(0, p.fisicoIn + diff);
                }
                else if(f === 'fisicoIn') {
                    let diff = v - p.fisicoIn;
                    if(diff > 0) { p.q += diff; } 
                    else if(diff < 0) { let toRemove = Math.abs(diff); for(let i=0; i<toRemove; i++) { if(p.q > 0) p.q--; else if(p.fis > 0) p.fis--; else p.q--; } }
                    p.fisicoIn = v;
                }
                else p[f] = v;
            }
            update();
        }
        document.getElementById('numpad-overlay').style.display = 'none';
    }

    function eseguiChiusuraEConsolidamentoTurno() {
        let vT=0; 
        prodotti.forEach(p => { 
            let m = Math.max(0, (p.inizio + p.c - (p.accPas + p.accPen)) - p.fisicoIn); 
            vT += (Math.max(0, m - Math.min(m, p.vPen)) * p.p) + (Math.min(m, p.vPen) * p.pen); 
        });

        let diffCassa = cassaRealeGlobal - vT;
        let pagaCalcolata = 26.00 + (cassaRealeGlobal * 0.05);

        let msg = `Confermi la chiusura e archiviazione del turno per la nave ${currentBoat}?\n\n` +
                  `💰 DETTAGLI ECONOMICI:\n` +
                  `• Cassa Teorica: € ${vT.toFixed(2)}\n` +
                  `• Cassa Reale Inserita: € ${cassaRealeGlobal.toFixed(2)}\n` +
                  `• Discrepanza: € ${diffCassa.toFixed(2)} (${diffCassa >= 0 ? 'PLUS' : 'PERDITA'})\n` +
                  `• Paga Spettante: € ${pagaCalcolata.toFixed(2)}\n\n` +
                  `🔒 CONSOLIDAMENTO INVENTARIO:\n` +
                  `• Il "Fisico Effettivo" diventerà la base di partenza per il prossimo turno.\n` +
                  `• Gli accumuli temporanei del turno verranno azzerati.\n` +
                  `• La cassa corrente verrà riportata a € 0.00.`;

        showModalConfirm("Salva, Consolida e Archivia", msg, function() {
            storicoChiusure.push({
                data: new Date().toLocaleString('it-IT'),
                teorico: vT.toFixed(2),
                reale: cassaRealeGlobal.toFixed(2),
                diffCassa: diffCassa.toFixed(2),
                paga: pagaCalcolata.toFixed(2),
                dettaglioVendite: ottieniVenditeSessioneCorrente()
            });
            localStorage.setItem(getStorageKey('history'), JSON.stringify(storicoChiusure));

            prodotti.forEach(p => {
                p.inizio = p.fisicoIn; 
                p.c = 0; 
                p.ddts = []; 
                p.accPas = 0; 
                p.accPen = 0; 
                p.vPas = 0; 
                p.vPen = 0; 
                p.q = p.fisicoIn > p.fis ? p.fisicoIn - p.fis : 0; 
            });

            cassaRealeGlobal = 0.00;
            localStorage.setItem(getStorageKey('cassa'), '0.00');
            localStorage.setItem(getStorageKey('prodotti'), JSON.stringify(prodotti));

            showToast("Turno consolidato e registrato con successo!", "🔒");
            init(); 
            openTab('tab-riepilogo'); // Riapre la tab unificata e scrolla in cima
        });
    }

    function ottieniVenditeSessioneCorrente() { return prodotti.filter(p => (p.vPas + p.vPen) > 0).map(p => ({ id: p.id, n: p.n, emoji: p.i, pas: p.vPas, pen: p.vPen, tot: p.vPas + p.vPen, valore: (p.vPas * p.p) + (p.vPen * p.pen) })); }

    // Update unificato per alimentare tutti gli elementi HTML del Riepilogo
    function update() {
        let pT=0, fT=0, invHTML='', vAtteso=0, vFisico=0, vTeorico=0, lHtml='', vArr=[];

            if(p.accPas===undefined)p.accPas=0; if(p.accPen===undefined)p.accPen=0;
